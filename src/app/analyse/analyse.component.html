<app-hero-contact
  titleBig="contact.aquaintment.title"
  titleMedium="contact.aquaintment.text_1"
  text="contact.aquaintment.text_2"
  [showButton]="false"
/>
@if (isBrowser) {
  <div class="tidycal">
    <iframe
      src="https://tidycal.com/elisabethkoch/stimmanalyse30min"
      #tidycalFrame
      title="TidyCal"
      allowfullscreen
      scrolling="auto"
    ></iframe>
    <div>
      <script
        async=""
        consent-by="services"
        consent-id="2944"
        type="application/javascript"
        src="https://asset-tidycal.b-cdn.net/js/embed.js"
        consent-transaction-complete="1"
      ></script>
    </div>
  </div>
} @else {
  <!-- Platzhalter für den Server (SSR), damit das Layout stabil bleibt -->
  <div class="tidycal-placeholder">
    <p>Lade Kalender...</p>
  </div>
}
